# ============================================================
#  QLoRA Fine-tuning — Classification Expert Adapter (H100)
# ============================================================
#  Uses ALL RVL-CDIP (320K) + Tobacco (2437) data.
#  H100 optimised: larger batch, 4 dataloader workers.
#
#  Usage:
#    python finetune_qlora.py --config finetune_config_lora_cls.yaml
# ============================================================

active_model: qwen25vl_3b

models:
  qwen25vl_3b:
    hf_id: Qwen/Qwen2.5-VL-3B-Instruct
    arch: qwen_vl
    category: generalist
    size: 3B
    trust_remote_code: true

qlora:
  rank: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules: auto
  quantization_bits: 4
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

training:
  batch_size: 8                        # H100 80GB — 2x vs RTX 5080
  gradient_accumulation_steps: 4       # effective batch = 32
  num_epochs: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_seq_length: 512
  optimizer: adamw_8bit
  use_gradient_checkpointing: true
  fp16: false
  bf16: true

checkpointing:
  save_steps: 1000
  save_total_limit: 5
  resume_from_checkpoint: true         # auto-resume if interrupted

evaluation:
  eval_strategy: steps
  eval_steps: 1000
  max_eval_samples: 2000

data:
  data_dir: formatted_data
  datasets:
    - tobacco
    - rvlcdip
  max_train_samples: null              # use ALL data
  val_split_ratio: 0.05

output:
  output_dir: finetune_outputs/lora_cls
  logging_steps: 50
  report_to: tensorboard               # view with: tensorboard --logdir finetune_outputs/lora_cls

hardware:
  seed: 42
  dataloader_num_workers: 4            # Linux H100 — parallel data loading
  ram_monitor_interval: 60
